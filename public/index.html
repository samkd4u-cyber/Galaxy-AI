<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galaxy AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0d24; --surface:#19163a; --line:#2c2760; --text:#ecebfa; --muted:#948fbd;
  --accent:#8b7cff; --user:#2a2566; --danger:#ff8a8a; --code:#0b0a1c;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;line-height:1.6}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);padding-top:max(12px,env(safe-area-inset-top))}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px;flex:1}
select,button{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toggle{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.toggle input{accent-color:var(--accent)}
a{color:var(--accent)}
#chat{flex:1;overflow-y:auto;padding:20px 16px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.msg{max-width:100%;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--user);padding:10px 14px;border-radius:16px 16px 4px 16px;max-width:85%}
.msg.bot{align-self:flex-start;width:100%}
.msg.error{color:var(--danger)}
.meta{font-size:12px;color:var(--muted);margin-top:4px}
.msg code{background:var(--code);padding:1px 6px;border-radius:5px;font-size:.9em}
.msg pre{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;white-space:pre;margin:8px 0}
.msg pre code{background:none;padding:0}
.empty{margin:auto;text-align:center;color:var(--muted);padding:40px 16px}
.empty strong{display:block;color:var(--text);font-size:22px;margin-bottom:6px}
form{padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.row{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;max-height:160px;font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
#send{background:var(--accent);border-color:var(--accent);color:#120f2e;font-weight:700}
@media (prefers-reduced-motion:no-preference){.dots::after{content:"";animation:d 1s steps(4) infinite}}
@keyframes d{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
</style>
</head>
<body>
<header>
  <h1>Galaxy AI</h1>
  <select id="model" aria-label="Model">
    <option value="auto">Auto (best available)</option>
    <option value="groq:openai/gpt-oss-120b">Groq: GPT-OSS 120B</option>
    <option value="gemini:gemini-2.5-flash">Gemini 2.5 Flash</option>
    <option value="openrouter:openrouter/free">OpenRouter: free router</option>
  </select>
  <label class="toggle"><input type="checkbox" id="search"> Web search</label>
  <button id="clear" type="button">New chat</button>
</header>

<main id="chat"><div class="wrap" id="log"></div></main>

<form id="form">
  <div class="row">
    <textarea id="input" rows="1" placeholder="Ask anything" aria-label="Message"></textarea>
    <button id="stop" type="button" hidden>Stop</button>
    <button id="send" type="submit">Send</button>
  </div>
</form>

<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), chat = $("chat"), input = $("input"), sendBtn = $("send"), stopBtn = $("stop");
let messages = [];
let controller = null;

try { messages = JSON.parse(localStorage.getItem("galaxy-chat") || "[]"); } catch (_) {}
const save = () => { try { localStorage.setItem("galaxy-chat", JSON.stringify(messages.slice(-40))); } catch (_) {} };

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function render(text){
  const parts = text.split("```");
  return parts.map((p, i) => {
    if (i % 2 === 1) return "<pre><code>" + esc(p.replace(/^[\w+-]*\n/, "")) + "</code></pre>";
    return esc(p).replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  }).join("");
}

function addMsg(role, text, extra){
  const el = document.createElement("div");
  el.className = "msg " + role + (extra ? " " + extra : "");
  if (role === "bot") el.innerHTML = render(text); else el.textContent = text;
  log.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

function showEmpty(){
  log.innerHTML = '<div class="empty"><strong>Galaxy AI</strong>Type a message to start. Pick a model above, or leave it on Auto.</div>';
}

function redraw(){
  log.innerHTML = "";
  if (!messages.length) return showEmpty();
  messages.forEach((m) => addMsg(m.role === "user" ? "user" : "bot", m.content));
}

async function send(text){
  if (log.querySelector(".empty")) log.innerHTML = "";
  messages.push({ role: "user", content: text });
  addMsg("user", text);
  const bot = addMsg("bot", "");
  bot.innerHTML = '<span class="dots">Thinking</span>';
  controller = new AbortController();
  sendBtn.hidden = true; stopBtn.hidden = false;
  let reply = "";
  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: controller.signal,
      body: JSON.stringify({ messages, model: $("model").value, search: $("search").checked }),
    });
    if (!r.ok) {
      let msg = "Request failed (" + r.status + ").";
      try { const j = await r.json(); msg = j.error || msg; if (j.details) msg += "\n" + j.details.join("\n"); } catch (_) {}
      throw new Error(msg);
    }
    const used = r.headers.get("X-Model-Used");
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      reply += dec.decode(value, { stream: true });
      bot.innerHTML = render(reply);
      chat.scrollTop = chat.scrollHeight;
    }
    const st = r.headers.get("X-Search");
    const notes = { "no-key": "Web search is not set up yet (add TAVILY_API_KEY in Vercel).", "failed": "Web search failed, answered without it.", "none-found": "No web results found." };
    if (used) { const m = document.createElement("div"); m.className = "meta"; m.textContent = "Answered by " + used + (st === "used" ? " with web search" : "") + (notes[st] ? ". " + notes[st] : ""); bot.appendChild(m); }
    messages.push({ role: "assistant", content: reply });
  } catch (e) {
    if (e.name === "AbortError") {
      if (reply) messages.push({ role: "assistant", content: reply });
      else messages.pop();
      if (!reply) bot.remove();
    } else {
      messages.pop();
      bot.classList.add("error");
      bot.textContent = e.message;
    }
  } finally {
    controller = null;
    sendBtn.hidden = false; stopBtn.hidden = true;
    save();
    input.focus();
  }
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || controller) return;
  input.value = ""; input.style.height = "auto";
  send(text);
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
});
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; });
stopBtn.addEventListener("click", () => controller && controller.abort());
$("clear").addEventListener("click", () => { if (controller) controller.abort(); messages = []; save(); redraw(); });

redraw();
</script>
</body>
</html>
